# Production / VM deployment: a self-contained image (compiled binary baked
# in, no bind mount, non-root, healthcheck, restart policy). Dev workflow
# stays in docker-compose.yml.
#
#   cp environment/.env.prod environment/.env.prod.local   # then set API_KEY etc.
#   docker compose --env-file environment/.env.prod.local \
#     -f environment/docker-compose.prod.yml up -d --build
# or: make -C environment deploy ENV=prod.local

name: meme-prod

services:
  api:
    build:
      context: ..
      dockerfile: environment/Dockerfile
      target: prod
    image: ${IMAGE_TAG:-meme-env:prod}
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8080}
      - WORK=/data/work
      - EXEC=${EXEC:-true}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SOLVER_TIMEOUT=${SOLVER_TIMEOUT:-}
    volumes:
      - work:/data/work
    ports:
      - "${HOST_PORT:-80}:${PORT:-8080}"
    stop_grace_period: 30s
    init: true

volumes:
  work:
