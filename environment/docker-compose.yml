# Build-and-test environment for the meme (energymodel) service.
#
# Per-environment settings (ports, work dir, image tag) come from an env file:
#   docker compose --env-file environment/.env.dev  -f environment/docker-compose.yml up api
#   docker compose --env-file environment/.env.prod -f environment/docker-compose.yml up api
# or via the Makefile:  make -C environment run ENV=dev   /   ENV=prod
#
# The repo root is bind-mounted into /src so edits are picked up without a
# rebuild; only the frameworks/solver layer is baked into the image.

name: meme

services:
  # Long-running API with real solver execution.
  api:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: ${IMAGE_TAG:-meme-env:latest}
    restart: unless-stopped
    working_dir: /src
    environment:
      # Unified vars, consumed by the Makefile's run target (?= lets the
      # environment win over the in-file defaults). API_KEY / CORS_ORIGINS are
      # forwarded as flags when set; empty keeps auth / CORS off.
      - ADDR=:${PORT:-8080}
      - WORK=${WORK:-/src/.work}
      - EXEC=${EXEC:-true}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    networks:
      default:
      tentacron-net:
        # Callers in other repositories address `meme`. The service name `api`
        # is shared by other repositories on this network and resolves to any
        # of them, so it is never an address. meme-env-api-1 is kept until
        # every caller has moved to `meme`.
        aliases: [meme, meme-env-api-1]
    command: make run

  # One-shot: compile everything and run the Go test suite.
  test:
    profiles: [tools]
    image: ${IMAGE_TAG:-meme-env:latest}
    build:
      context: ..
      dockerfile: environment/Dockerfile
    working_dir: /src
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    command: make test

  # Interactive shell with Go + all three frameworks (both Calliope releases) + solvers (HiGHS/CBC/GLPK) on PATH.
  shell:
    profiles: [tools]
    image: ${IMAGE_TAG:-meme-env:latest}
    build:
      context: ..
      dockerfile: environment/Dockerfile
    working_dir: /src
    volumes:
      - ..:/src
      - go-build:/root/.cache/go-build
      - go-mod:/root/go/pkg/mod
    command: bash

volumes:
  go-build:
  go-mod:

# The key must equal the name and this block must stay exactly as it is:
# Compose labels the network with the key, and every repository joining
# tentacron-net declares it identically. A different key fails with
# "network tentacron-net was found but has incorrect label"; adding a driver or
# ipam block makes a joining project try to recreate the network.
networks:
  tentacron-net:
    name: tentacron-net
