model:
  name: calliope_plan
  calliope_version: 0.6.8
  timeseries_data_path: timeseries_data
run:
  mode: plan
  solver: cbc
  objective_options:
    cost_class:
      monetary: 1
    sense: minimize
techs:
  load:
    essentials:
      name: load
      parent: demand
      carrier_in: electricity
  pv:
    essentials:
      name: pv
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_max: 1000
      lifetime: 25
    costs:
      monetary:
        energy_cap: 500000
        interest_rate: 0.05
locations:
  n1:
    coordinates:
      lat: 48.0
      lon: 11.0
    techs:
      load:
        constraints:
          resource: "file=load__resource.csv:n1"
      pv:
