model:
  name: pypsa_multi_period
  calliope_version: 0.6.8
  timeseries_data_path: timeseries_data
run:
  mode: plan
  solver: cbc
  objective_options:
    cost_class:
      monetary: 1
    sense: minimize
techs:
  load:
    essentials:
      name: load
      parent: demand
      carrier_in: electricity
  new:
    essentials:
      name: new
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_max: 100
      lifetime: 20
    costs:
      monetary:
        energy_cap: 1000
        om_prod: 20
        interest_rate: 0.05
  old:
    essentials:
      name: old
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_equals: 50
      lifetime: 15
    costs:
      monetary:
        om_prod: 10
locations:
  n1:
    techs:
      load:
        constraints:
          resource: "file=load__resource.csv:n1"
      new:
      old:
