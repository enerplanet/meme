model:
  name: pypsa_node_override
  calliope_version: 0.6.8
  timeseries_data_path: timeseries_data
run:
  mode: plan
  solver: cbc
  objective_options:
    cost_class:
      monetary: 1
    sense: minimize
techs:
  l1:
    essentials:
      name: l1
      parent: demand
      carrier_in: electricity
  l2:
    essentials:
      name: l2
      parent: demand
      carrier_in: electricity
  pv:
    essentials:
      name: pv
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_max: 1000
      lifetime: 25
    costs:
      monetary:
        energy_cap: 500000
        interest_rate: 0.05
locations:
  n1:
    coordinates:
      lat: 48.0
      lon: 11.0
    techs:
      l1:
        constraints:
          resource: "file=l1__resource.csv:n1"
      pv:
  n2:
    coordinates:
      lat: 52.0
      lon: 7.0
    techs:
      l2:
        constraints:
          resource: "file=l2__resource.csv:n2"
      pv:
        constraints:
          energy_cap_max: 500
        costs:
          monetary:
            energy_cap: 700000
            interest_rate: 0.05
