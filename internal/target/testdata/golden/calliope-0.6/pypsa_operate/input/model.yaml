model:
  name: pypsa_operate
  calliope_version: 0.6.8
  timeseries_data_path: timeseries_data
run:
  mode: operate
  solver: cbc
  objective_options:
    cost_class:
      monetary: 1
    sense: minimize
  operation:
    window: 12
    horizon: 12
techs:
  gen:
    essentials:
      name: gen
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_equals: 300
    costs:
      monetary:
        om_prod: 30
  load:
    essentials:
      name: load
      parent: demand
      carrier_in: electricity
locations:
  n1:
    techs:
      gen:
      load:
        constraints:
          resource: "file=load__resource.csv:n1"
