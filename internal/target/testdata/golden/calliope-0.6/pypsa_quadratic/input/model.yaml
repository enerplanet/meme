model:
  name: pypsa_quadratic
  calliope_version: 0.6.8
  timeseries_data_path: timeseries_data
run:
  mode: plan
  solver: cbc
  objective_options:
    cost_class:
      monetary: 1
    sense: minimize
techs:
  load:
    essentials:
      name: load
      parent: demand
      carrier_in: electricity
  peaker:
    essentials:
      name: peaker
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_equals: 100
    costs:
      monetary:
        om_prod: 60
  quad:
    essentials:
      name: quad
      parent: supply
      carrier_out: electricity
    constraints:
      energy_cap_equals: 100
    costs:
      monetary:
        om_prod: 10
locations:
  n1:
    techs:
      load:
        constraints:
          resource: "file=load__resource.csv:n1"
      peaker:
      quad:
