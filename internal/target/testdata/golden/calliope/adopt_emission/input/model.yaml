config:
  init:
    mode: base
    broadcast_input_data: true
    math_paths:
      additional_math: additional_math.yaml
    extra_math: [additional_math]
  solve:
    solver: glpk
techs:
  load:
    base_tech: demand
    carrier_in: electricity
  grid_import:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 1e+06
    cost_flow_out:
      data: [50, 0.3]
      index: [monetary, co2]
      dims: costs
nodes:
  n1:
    latitude: 48.8
    longitude: 12.9
    techs:
      load:
      grid_import:
data_definitions:
  objective_cost_weights:
    data: 0
    index: co2
    dims: costs
data_tables:
  load__sink_use_equals:
    data: dem.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
