config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  gen:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 1000
    cost_flow_out:
      data: 40
      index: monetary
      dims: costs
  load:
    base_tech: demand
    carrier_in: electricity
  l1:
    base_tech: transmission
    carrier_in: electricity
    carrier_out: electricity
    link_from: n1
    link_to: hub
    flow_out_eff: 0.97
    flow_cap_max: 500
  l2:
    base_tech: transmission
    carrier_in: electricity
    carrier_out: electricity
    link_from: hub
    link_to: n2
    flow_out_eff: 0.97
    flow_cap_max: 500
nodes:
  hub:
    techs: {}
  n1:
    latitude: 48.0
    longitude: 11.0
    techs:
      gen:
  n2:
    latitude: 49.0
    longitude: 12.0
    techs:
      load:
data_tables:
  load__sink_use_equals:
    data: load_sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
