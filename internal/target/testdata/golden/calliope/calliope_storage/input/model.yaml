config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  batt:
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity
    flow_out_eff: 0.95
    flow_in_eff: 0.95
    storage_loss: 0.001
    cyclic_storage: true
    storage_initial: 0.5
    storage_cap_max: 800
    storage_cap_min: 20
    lifetime: 15
    cost_storage_cap:
      data: 300
      index: monetary
      dims: costs
  grid:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 10000
    cost_flow_out:
      data: 50
      index: monetary
      dims: costs
  load:
    base_tech: demand
    carrier_in: electricity
nodes:
  n1:
    techs:
      batt:
      grid:
      load:
data_tables:
  load__sink_use_equals:
    data: dem.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
