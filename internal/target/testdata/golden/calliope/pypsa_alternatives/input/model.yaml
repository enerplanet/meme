    carrier_out: electricity
    flow_cap_max: 500
    lifetime: 25
    cost_flow_cap:
      data: 450000
      index: monetary
      dims: costs
    cost_interest_rate:
      data: 0.05
      index: monetary
      dims: costs
    cost_flow_out:
      data: 40
      index: monetary
      dims: costs
  load:
