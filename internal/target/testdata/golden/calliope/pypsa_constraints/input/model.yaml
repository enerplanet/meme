config:
  init:
    mode: base
    broadcast_input_data: true
    math_paths:
      additional_math: additional_math.yaml
    extra_math: [additional_math]
  solve:
    solver: cbc
techs:
  load:
    base_tech: demand
    carrier_in: electricity
  pv:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 1000
    lifetime: 25
    cost_flow_cap:
      data: 500000
      index: monetary
      dims: costs
    cost_interest_rate:
      data: 0.05
      index: monetary
      dims: costs
nodes:
  n1:
    techs:
      load:
      pv:
data_tables:
  load__sink_use_equals:
    data: load_sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
