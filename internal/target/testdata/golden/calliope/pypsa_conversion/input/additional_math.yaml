constraints:
  meme_ratio_chp_out_electricity:
    description: "energymodel fixed flow ratio"
    foreach: [nodes, techs, timesteps]
    where: "[chp] in techs"
    equations:
      - 
        expression: "flow_out[carriers=electricity] == 0.4 * flow_in[carriers=gas]"
  meme_ratio_chp_out_heat:
    description: "energymodel fixed flow ratio"
    foreach: [nodes, techs, timesteps]
    where: "[chp] in techs"
    equations:
      - 
        expression: "flow_out[carriers=heat] == 0.45 * flow_in[carriers=gas]"
  balance_conversion:
    description: "Fix the relationship between a `conversion` technology's outflow and consumption."
    foreach: [nodes, techs, timesteps]
    where: "base_tech==conversion AND NOT include_storage==true AND NOT [chp] in techs"
    equations:
      - 
        expression: "sum(flow_out_inc_eff, over=carriers) == sum(flow_in_inc_eff, over=carriers)"
