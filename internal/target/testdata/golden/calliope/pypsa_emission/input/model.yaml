config:
  init:
    mode: base
    broadcast_input_data: true
    math_paths:
      additional_math: additional_math.yaml
    extra_math: [additional_math]
  solve:
    solver: cbc
techs:
  gas_src:
    base_tech: supply
    carrier_out: gas
    flow_cap_max: 10000
    cost_flow_out:
      data: 20
      index: monetary
      dims: costs
  gasgen:
    base_tech: conversion
    carrier_in: gas
    carrier_out: electricity
    flow_out_eff: 0.5
    flow_cap_max: 1000
    cost_flow_out:
      data: 5
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.2
      index: co2
      dims: costs
  load:
    base_tech: demand
    carrier_in: electricity
nodes:
  n1:
    techs:
      gas_src:
      gasgen:
      load:
data_definitions:
  objective_cost_weights:
    data: 0
    index: co2
    dims: costs
data_tables:
  load__sink_use_equals:
    data: load_sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
