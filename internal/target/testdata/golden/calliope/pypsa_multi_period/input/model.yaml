config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  load:
    base_tech: demand
    carrier_in: electricity
  new:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 100
    lifetime: 20
    cost_flow_cap:
      data: 1000
      index: monetary
      dims: costs
    cost_interest_rate:
      data: 0.05
      index: monetary
      dims: costs
    cost_flow_out:
      data: 20
      index: monetary
      dims: costs
  old:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 50
    flow_cap_min: 50
    lifetime: 15
    cost_flow_out:
      data: 10
      index: monetary
      dims: costs
nodes:
  n1:
    techs:
      load:
      new:
      old:
data_tables:
  load__sink_use_equals:
    table: load__sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      inputs: sink_use_equals
