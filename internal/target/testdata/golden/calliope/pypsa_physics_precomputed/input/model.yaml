config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  gas:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 1000
    cost_flow_out:
      data: 80
      index: monetary
      dims: costs
  load:
    base_tech: demand
    carrier_in: electricity
  pv:
    base_tech: supply
    carrier_out: electricity
    source_unit: per_cap
    flow_cap_max: 1000
    lifetime: 25
    cost_flow_cap:
      data: 500000
      index: monetary
      dims: costs
    cost_interest_rate:
      data: 0.05
      index: monetary
      dims: costs
nodes:
  n1:
    latitude: 48.8
    longitude: 12.9
    techs:
      gas:
      load:
      pv:
data_tables:
  load__sink_use_equals:
    data: dem.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
  pv__source_use_max:
    data: pv_cf.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: source_use_max
