config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  load:
    base_tech: demand
    carrier_in: electricity
  peaker:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 100
    flow_cap_min: 100
    cost_flow_out:
      data: 60
      index: monetary
      dims: costs
  quad:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 100
    flow_cap_min: 100
    cost_flow_out:
      data: 10
      index: monetary
      dims: costs
nodes:
  n1:
    techs:
      load:
      peaker:
      quad:
data_tables:
  load__sink_use_equals:
    table: load__sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      inputs: sink_use_equals
