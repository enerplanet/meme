config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  battery:
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity
    flow_out_eff: 0.95
    flow_in_eff: 0.95
    storage_loss: 0.001
    cyclic_storage: true
    storage_cap_max: 40
    storage_discharge_depth: 0.1
    flow_cap_per_storage_cap_max: 0.5
    flow_cap_max: 10
    cost_flow_cap:
      data: 10
      index: monetary
      dims: costs
    cost_storage_cap:
      data: 2
      index: monetary
      dims: costs
    cost_depreciation_rate:
      data: 1
      index: monetary
      dims: costs
    cost_flow_out:
      data: 1
      index: monetary
      dims: costs
  grid:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 100
    flow_cap_min: 100
    cost_flow_out:
      data: 120
      index: monetary
      dims: costs
  load:
    base_tech: demand
    carrier_in: electricity
  pumped:
    base_tech: storage
    carrier_in: electricity
    carrier_out: electricity
    flow_out_eff: 0.9
    flow_in_eff: 0.8
    storage_initial: 0.5
    flow_cap_max: 4
    flow_cap_min: 4
  pv:
    base_tech: supply
    carrier_out: electricity
    source_unit: per_cap
    flow_cap_max: 20
    flow_cap_min: 20
    cost_flow_out:
      data: 1
      index: monetary
      dims: costs
nodes:
  n1:
    techs:
      battery:
      grid:
      load:
      pumped:
      pv:
data_tables:
  load__sink_use_equals:
    table: load__sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      inputs: sink_use_equals
  pv__source_use_max:
    table: pv__source_use_max.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      inputs: source_use_max
