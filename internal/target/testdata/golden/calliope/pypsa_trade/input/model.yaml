config:
  init:
    mode: base
    broadcast_input_data: true
  solve:
    solver: cbc
techs:
  load:
    base_tech: demand
    carrier_in: electricity
  market_import:
    base_tech: supply
    carrier_out: electricity
    flow_cap_max: 500
    cost_flow_out:
      data: [60, 0.35]
      index: [monetary, co2]
      dims: costs
  market_export:
    base_tech: demand
    carrier_in: electricity
    sink_use_max: 200
    cost_flow_in:
      data: [-30]
      index: [monetary]
      dims: costs
nodes:
  n1:
    techs:
      load:
      market_import:
      market_export:
data_definitions:
  objective_cost_weights:
    data: 0
    index: co2
    dims: costs
data_tables:
  load__sink_use_equals:
    data: load_sink_use_equals.csv
    rows: timesteps
    columns: [techs, nodes]
    add_dims:
      parameters: sink_use_equals
