# Project information
site_name: MEME
site_author: enerplanet
site_description: >-
  Multi Energy Model Execution: one canonical energy-system model, translated
  into PyPSA, Calliope (0.7 and 0.6) and AdOpT-NET0 inputs, solved, and
  returned as a result bundle through a REST API.
site_url: https://enerplanet.github.io/meme

# Repository
repo_name: enerplanet/meme
repo_url: https://github.com/enerplanet/meme
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  favicon: assets/logos/favicon.svg # the MEME mark on its plate
  logo: assets/logos/meme-mark.svg # the mark alone; the header is the ink plate in both schemes
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom # the brand palette applies in "follow system" mode as well
      accent: custom
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom # MEME ink + signature blue, see assets/stylesheets/extra.css
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/stylesheets/extra.css

# Plugins
plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      enable_creation_date: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # Snippets pull CHANGELOG.md and CONTRIBUTING.md from the repository root
  # into the site, so they have one source. Paths resolve against the
  # repository root: build with `make docs` or run mkdocs from the root.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
      - Examples: getting-started/examples.md
  - Service:
      - Architecture: architecture.md
      - API reference: api.md
      - Canonical model: model.md
      - Targets and versions: targets.md
      - Capability matrix: capabilities.md
      - Scenario catalog: scenarios.md
  - Reference:
      - Capability reference: reference/capability-reference.md
      - Changelog: changelog.md
  - Operations:
      - Environment: operations/environment.md
      - Testing: operations/testing.md
  - Decisions:
      - Overview: decisions/README.md
      - ADR-0001 Go single binary: decisions/0001-go-single-binary.md
      - ADR-0002 Capability-gated validation: decisions/0002-capability-gated-validation.md
      - ADR-0003 Native passthrough: decisions/0003-native-passthrough.md
      - ADR-0004 Golden files: decisions/0004-golden-files-freeze-the-emitter-contract.md
      - ADR-0005 Async job API: decisions/0005-async-job-api-and-result-bundle.md
      - ADR-0006 Framework versions as targets: decisions/0006-framework-versions-as-targets.md
      - ADR-0007 Free solvers: decisions/0007-free-solvers.md
      - Template: decisions/0000-template.md
  - Contributing:
      - Overview: contributing/index.md
      - Branch naming: getting-started/branch-naming.md
      - Branch rules: getting-started/branch-rules.md
      - Commit conventions: getting-started/commit-conventions.md
      - Legal sync: getting-started/legal-sync.md

